name: Radar Pipeline

on:
  workflow_dispatch:

concurrency:
  group: radar-pipeline
  cancel-in-progress: false

env:
  MAX_KEEP: 12

jobs:
  # EIN Job statt Matrix: PX250-Komposit wird nur einmal geladen/berechnet und von HymecNG wiederverwendet
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto

    steps:
      - name: Zeitslot bestimmen (5 min, UTC)
        run: |
          NOW=$(date -u +%s)
          SLOT_EPOCH=$(( NOW / 300 * 300 ))
          {
            echo "SLOT_EPOCH=$SLOT_EPOCH"
            echo "DATE=$(date -u -d "@$SLOT_EPOCH" +%Y%m%d)"
            echo "TIME=$(date -u -d "@$SLOT_EPOCH" +%H%M)"
            echo "BERLIN_DATE=$(TZ=Europe/Berlin date -d "@$SLOT_EPOCH" +%Y%m%d)"
            echo "BERLIN_TIME=$(TZ=Europe/Berlin date -d "@$SLOT_EPOCH" +%H%M)"
            echo "RUN=$(date -u -d "@$SLOT_EPOCH" +%Y%m%d_%H%M)"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.LIVE_PAT }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # Kein festes sleep mehr: die Skripte pollen selbst und starten sofort
      - name: Download + Verarbeitung (PX250 und HymecNG parallel)
        run: |
          mkdir -p data/hymecng
          HY_FILE="composite_HymecNG_${DATE}_${TIME}_000-hd5"
          HY_URL="https://opendata.dwd.de/weather/radar/composite/hymecng/${HY_FILE}"

          # HymecNG-Datei im Hintergrund pollen, waehrend PX250 laeuft
          (
            for i in $(seq 1 80); do
              CODE=$(curl -s -o "$RUNNER_TEMP/hy.tmp" -w "%{http_code}" --connect-timeout 10 --max-time 60 "$HY_URL" || echo 000)
              if [ "$CODE" = "200" ] && [ -s "$RUNNER_TEMP/hy.tmp" ]; then
                mv "$RUNNER_TEMP/hy.tmp" "data/hymecng/$HY_FILE"; echo "[HymecNG] da (Versuch $i)"; exit 0
              fi
              sleep 3
            done
            exit 1
          ) &
          HY_PID=$!

          # PX250: schlaegt es fehl, laeuft HymecNG trotzdem (Fallback-Marker im Cache)
          python scripts/bin_px250.py || echo "::warning::PX250 fehlgeschlagen - HymecNG laeuft im Fallback"

          wait $HY_PID || { echo "::error::HymecNG-Datei nicht verfuegbar"; exit 1; }
          python scripts/bin_hymecng.py   # nutzt data/cache -> kein zweiter Download

      - name: Veroeffentlichen (beide parallel)
        run: |
          set +e
          scripts/publish.sh px250 scripts/meta_px250.py output/px250 px250 & P1=$!
          scripts/publish.sh liveanalyse scripts/meta_hymecng.py output/hymecng liveanalyse & P2=$!
          wait $P1; R1=$?
          wait $P2; R2=$?
          # HymecNG ist Pflicht; ein fehlendes PX250-Bild (Ausfall) ist nur eine Warnung
          [ $R1 -ne 0 ] && echo "::warning::PX250 nicht veroeffentlicht"
          exit $R2